<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f05bb8" />
    <meta name="description" content="秘密偶像公主圖鑑 PWA，支援離線瀏覽、收藏與備註。" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
    <title>秘密偶像公主圖鑑</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="hero__glow hero__glow--left"></div>
        <div class="hero__glow hero__glow--right"></div>
        <p class="hero__eyebrow">AIPRI CARD DEX</p>
        <h1>秘密偶像公主圖鑑</h1>
        <p class="hero__subtitle">手機優先、可離線、可收藏，也能把每張卡的備註好好記下來。</p>
        <div class="hero__stats">
          <article class="stat-card">
            <span class="stat-card__label">總卡片</span>
            <strong id="totalCount">0</strong>
          </article>
          <article class="stat-card">
            <span class="stat-card__label">已擁有</span>
            <strong id="ownedCount">0</strong>
          </article>
          <article class="stat-card">
            <span class="stat-card__label">想要</span>
            <strong id="wantedCount">0</strong>
          </article>
          <article class="stat-card">
            <span class="stat-card__label">收藏</span>
            <strong id="favoriteCount">0</strong>
          </article>
        </div>
      </header>

      <section class="toolbar">
        <div class="toolbar__row">
          <label class="search-box" for="searchInput">
            <span>搜尋</span>
            <input
              id="searchInput"
              type="search"
              inputmode="search"
              placeholder="搜尋卡片名或角色名"
              autocomplete="off"
            />
          </label>
        </div>

        <div class="toolbar__row toolbar__row--segmented">
          <div class="segmented" role="tablist" aria-label="檢視模式">
            <button type="button" class="segmented__button is-active" data-view="all">全部圖鑑</button>
            <button type="button" class="segmented__button" data-view="favorites">收藏夾</button>
          </div>
        </div>

        <div class="filters">
          <label class="field">
            <span>代數</span>
            <select id="generationFilter">
              <option value="">全部代數</option>
            </select>
          </label>

          <label class="field">
            <span>角色</span>
            <select id="characterFilter">
              <option value="">全部角色</option>
            </select>
          </label>

          <label class="field">
            <span>已擁有</span>
            <select id="ownedFilter">
              <option value="">全部</option>
              <option value="owned">已擁有</option>
              <option value="unowned">未擁有</option>
            </select>
          </label>

          <label class="chip-toggle">
            <input id="wantedOnlyFilter" type="checkbox" />
            <span>只看想要</span>
          </label>

          <label class="chip-toggle">
            <input id="favoriteOnlyFilter" type="checkbox" />
            <span>只看收藏</span>
          </label>

          <button id="resetFiltersButton" type="button" class="secondary-button">重置篩選</button>
        </div>

        <div class="toolbar__row toolbar__row--actions">
          <button id="exportButton" type="button" class="pill-button">匯出備份</button>
          <button id="importButton" type="button" class="pill-button pill-button--soft">匯入備份</button>
          <button id="installButton" type="button" class="pill-button pill-button--hidden">加入主畫面</button>
          <input id="importFileInput" type="file" accept="application/json" hidden />
        </div>

        <div class="toolbar__row toolbar__row--status">
          <p id="resultSummary" class="result-summary">載入中...</p>
          <p id="syncStatus" class="sync-status" aria-live="polite"></p>
        </div>
      </section>

      <main class="content">
        <section id="cardGrid" class="card-grid" aria-live="polite"></section>
        <section id="emptyState" class="empty-state" hidden>
          <div class="empty-state__badge">No Match</div>
          <h2>目前沒有符合條件的卡片</h2>
          <p>可以試著清除部分篩選條件，或切回全部圖鑑看看。</p>
        </section>
      </main>
    </div>

    <dialog id="cardDialog" class="card-dialog">
      <form method="dialog" class="card-dialog__panel">
        <button id="closeDialogButton" type="submit" class="card-dialog__close" aria-label="關閉詳細資料">
          ×
        </button>

        <div class="card-dialog__media">
          <div class="image-switcher">
            <button id="showFrontButton" type="button" class="image-switcher__button is-active">正面</button>
            <button id="showBackButton" type="button" class="image-switcher__button">反面</button>
          </div>
          <img id="dialogImage" src="" alt="" loading="eager" />
        </div>

        <div class="card-dialog__content">
          <div class="card-dialog__heading">
            <p id="dialogCode" class="card-code"></p>
            <h2 id="dialogName"></h2>
            <p id="dialogMeta" class="card-meta"></p>
          </div>

          <div class="detail-grid">
            <article class="detail-chip">
              <span>角色</span>
              <strong id="dialogCharacter"></strong>
            </article>
            <article class="detail-chip">
              <span>代數</span>
              <strong id="dialogGeneration"></strong>
            </article>
            <article class="detail-chip">
              <span>分類</span>
              <strong id="dialogCategory"></strong>
            </article>
          </div>

          <div class="state-controls">
            <label class="state-toggle">
              <input id="ownedCheckbox" type="checkbox" />
              <span>已擁有</span>
            </label>
            <label class="state-toggle">
              <input id="wantedCheckbox" type="checkbox" />
              <span>想要</span>
            </label>
            <button id="favoriteButton" type="button" class="favorite-button">加入收藏</button>
          </div>

          <label class="note-field" for="noteTextarea">
            <span>卡片備註</span>
            <textarea
              id="noteTextarea"
              rows="5"
              placeholder="例如：想補哪一彈、交換來源、卡況、預算等"
            ></textarea>
          </label>
        </div>
      </form>
    </dialog>

    <template id="cardTemplate">
      <article class="card-tile">
        <button type="button" class="card-tile__button">
          <div class="card-tile__image-wrap">
            <img class="card-tile__image" src="" alt="" loading="lazy" />
          </div>
          <div class="card-tile__body">
            <div class="card-tile__badges"></div>
            <h2 class="card-tile__name"></h2>
            <p class="card-tile__character"></p>
            <p class="card-tile__generation"></p>
          </div>
        </button>
      </article>
    </template>

    <script src="cards-data.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
